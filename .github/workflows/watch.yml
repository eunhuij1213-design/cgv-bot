name: CGV 예매 감시

on:
  schedule:
    # GitHub Actions cron 최소 간격은 5분이다. 1분 감시는 잡 안에서 --watch로 돌린다.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 이전 실행이 state.json을 커밋하는 중에 겹치지 않도록 직렬화
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 감시 실행 (60초 간격 × 약 5분)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"  # 로그가 잡 실행 중 실시간으로 보이도록
        run: python main.py --watch 60 --duration 270

      - name: state.json 커밋
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: state 갱신 [skip ci]"
          # 다른 실행이 먼저 푸시했을 수 있으니 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
